name: Python converter tests

on:
  push:
  pull_request:

jobs:
  converter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install converter dependencies
        run: python -m pip install -r tools/mp4_to_oled/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
